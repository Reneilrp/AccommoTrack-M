release_checklist:
  branch_protection_policy_required_checks:
    status: pass
    required_checks:
      - backend-pest
      - backend-smoke-contracts
      - web-jest
    notes: backend-smoke-contracts is now part of the required status checks for release gating.
  migrations_up_to_date:
    status: pass
    command: cd backend && php artisan migrate:status
  cache_cycle_validated:
    status: pass
    commands:
      - cd backend && php artisan optimize:clear
      - cd backend && php artisan config:cache
      - cd backend && php artisan route:cache
  route_presence_verified:
    status: pass
    commands:
      - cd backend && php artisan route:list --path=admin/payments
      - cd backend && php artisan route:list --path=admin/audit-logs
  monitoring_queries_prepared:
    status: pass
    queries:
      - payment.admin_overridden
      - payment.denied
      - Failed to override payment
      - Forbidden. Admins only.
  rollback_plan_documented:
    status: pass
    steps:
      - Remove admin sidebar links in frontend/AccommoTrackWeb/src/components/Layout/AdminLayout.jsx
      - Remove admin routes in frontend/AccommoTrackWeb/src/Navigation/AdminNavigator.jsx
      - Remove backend admin oversight/audit routes in backend/routes/api.php
      - Rebuild backend cache cycle (optimize:clear, config:cache, route:cache)
      - Verify removed routes and hidden UI discoverability

validation_runs:
  - name: backend_uat_critical
    command: cd backend && php artisan test --filter=AdminPaymentOversightAuditTest
    result: pass
    details: 8 tests, 52 assertions
  - name: frontend_uat_critical
    command: cd frontend/AccommoTrackWeb && npm test -- --runInBand src/screens/Admin/__tests__/PaymentOversight.test.jsx src/screens/Admin/__tests__/AuditExplorer.test.jsx
    result: pass
    details: 2 suites, 5 tests
  - name: web_production_build
    command: cd frontend/AccommoTrackWeb && npm run build
    result: pass
    details: chunk-size warning only (non-blocking)

broader_pre_release_sweep:
  - gate: backend_full_test_suite
    command: cd backend && composer test:pest
    result: pass
    details: 49 tests, 245 assertions
  - gate: backend_smoke_contracts
    command: cd backend && php artisan test --filter='AnalyticsExportCsvTest|CashPaymentFlowTest'
    result: pass
    details: 7 tests, 59 assertions
  - gate: web_full_jest
    command: cd frontend/AccommoTrackWeb && npm test -- --runInBand
    result: pass
    details: 8 suites, 28 tests
  - gate: web_lint
    command: cd frontend/AccommoTrackWeb && npm run lint
    result: pass_with_warnings
    details: 33 warnings, 0 errors
  - gate: mobile_lint
    command: cd frontend/AccommoTrackMobile && npx expo lint
    result: pass_with_warnings
    details: 120 warnings, 0 errors
  - gate: web_build
    command: cd frontend/AccommoTrackWeb && npm run build
    result: pass
    details: chunk-size warning only (non-blocking)
