name: Test Gates

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-gates-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-pest:
    name: Backend Pest
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: accommotrack_test
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    defaults:
      run:
        working-directory: backend

    env:
      APP_ENV: testing
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: accommotrack_test
      DB_USERNAME: root
      DB_PASSWORD: root

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          coverage: none
          extensions: mbstring, pdo_mysql, bcmath

      - name: Install Composer Dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Prepare App Key
        run: |
          cp -n .env.example .env || true
          php artisan key:generate --ansi --force

      - name: Run Pest
        run: composer test:pest

  backend-smoke-contracts:
    name: Backend Smoke Contracts
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: accommotrack_test
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    defaults:
      run:
        working-directory: backend

    env:
      APP_ENV: testing
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: accommotrack_test
      DB_USERNAME: root
      DB_PASSWORD: root

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          coverage: none
          extensions: mbstring, pdo_mysql, bcmath

      - name: Install Composer Dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Prepare App Key
        run: |
          cp -n .env.example .env || true
          php artisan key:generate --ansi --force

      - name: Run Backend Smoke Contracts
        run: php artisan test --filter='AnalyticsExportCsvTest|CashPaymentFlowTest'

  web-jest:
    name: Web Jest
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend/AccommoTrackWeb

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/AccommoTrackWeb/package-lock.json

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: Run Jest
        run: npm test -- --runInBand

      - name: Run ESLint
        run: npm run lint

      - name: Run Build
        run: npm run build

  mobile-jest:
    name: Mobile Jest
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend/AccommoTrackMobile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/AccommoTrackMobile/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Install TypeScript for Lint
        run: npm i --no-save typescript

      - name: Run Jest
        run: npm test -- --runInBand

      - name: Run ESLint
        run: npm run lint
